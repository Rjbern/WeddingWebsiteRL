<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not Found</title>
  </head>
  <body>
    <script>
      // If a user navigates directly to a client-side route on GitHub Pages,
      // the server returns this 404 page. Fetch and render the app's
      // index.html so the SPA can handle the current path.
      (function() {
        var indexPath = '%PUBLIC_URL%/index.html';
        fetch(indexPath).then(function(response) {
          return response.text();
        }).then(function(html) {
          document.open();
          document.write(html);
          document.close();
        }).catch(function() {
          // Fallback: redirect to repo root
          window.location.replace('%PUBLIC_URL%/');
        });
      })();
    </script>
    <noscript>
      JavaScript is required to view this site. Please enable JavaScript.
    </noscript>
  </body>
</html>
